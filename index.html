<style>
  :root{--navy:#0f2a4a;--navy2:#1b3f6b;--gold:#c9a227;--gold2:#f3e3a6;--ink:#1d2733;--mut:#5f6b7a;--bg:#f4f6fa;--line:#dfe5ee;--ok:#1f8a4c;--bad:#c0392b;

  .card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px rgba(15,42,74,.08);border:1px solid var(--line)}

  .en{color:var(--mut);font-size:12.5px;font-style:italic;display:block;margin-top:2px;font-weight:400}

  .btn.full{width:100%}

  .nm .no{color:var(--mut);font-size:13px;margin-right:8px;font-variant-numeric:tabular-nums}
  .sent{font-size:11.5px;color:var(--ok);background:#e8f6ee;padding:3px 8px;border-radius:99px;white-space:nowrap}
  .chosen{margin-top:10px;font-size:14px;color:var(--navy);font-weight:600}
  .lbl{font-size:13.5px;font-weight:600;margin:14px 0 8px;display:block}
  .err{display:none;background:#fdecea;color:var(--bad);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:12px}

  .bar{flex:1;height:8px;background:#e8edf4;border-radius:99px;overflow:hidden}

  .stem{font-size:17px;font-weight:700;color:var(--navy);line-height:1.35}
  .stem .en{font-size:13.5px}
  .opts{display:grid;gap:10px;margin-top:14px}
  .op{border:1.5px solid var(--line);border-radius:14px;padding:12px 12px 10px;background:#fff;transition:.12s}
  .op.m{border-color:var(--ok);background:#f0faf4}
  .op.l{border-color:#d9a3a0;background:#fdf4f3}
  .op .t{font-size:15px;line-height:1.4}
  .op .t .en{font-size:12.5px}
  .pick{display:flex;gap:8px;margin-top:10px}
  .pick button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 6px;font:inherit;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer}

  .prog{justify-content:space-between}
  .done-n{color:var(--ok);font-weight:600}

  .blend{display:inline-flex;gap:6px;margin:10px 0 2px}
  .blend span{font-weight:800;font-size:24px;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;background:var(--c)}
  .bars{display:grid;gap:10px;margin-top:6px}
  .br{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;font-size:13.5px}
  .br .tr{height:14px;background:#eef2f7;border-radius:99px;overflow:hidden;position:relative}
  .br .tr:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:#c9d2de}
  .br .tr i{display:block;height:100%;background:var(--c);border-radius:99px}
  .br b{color:var(--c)}
  .br .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
  .desc h3{margin:14px 0 6px;font-size:15px;color:var(--navy)}
  .desc p{margin:0 0 8px;font-size:14px;line-height:1.55}
  .desc .k{font-weight:700;color:var(--navy)}
  .foot{text-align:center;font-size:12px;color:var(--mut);margin-top:18px}
  input[type=email]{width:100%;font:inherit;font-size:16px;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  .ver{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:6px 0 0;font-size:15px}
  .ver dt{color:var(--mut);font-size:13px;padding-top:2px}
  .ver dd{margin:0;font-weight:600;color:var(--navy);word-break:break-word}
  .muted{color:var(--mut);font-weight:400}
  .act{display:flex;flex-wrap:wrap;gap:8px}
  .act .btn{flex:1 1 150px;padding:12px 10px;font-size:14.5px}
  .print-only{display:none}
  @media print{
    body{background:#fff}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .hero{padding:14px 18px}

    .actions,.foot{display:none}
    .card{box-shadow:none;break-inside:avoid;margin-bottom:10px}
    .print-only{display:block;font-size:11px;color:#5f6b7a;text-align:center;margin-top:8px}

  .circ{display:block;width:100%;max-width:320px;margin:10px auto 0}

  .circ .ax{font:600 10.5px "Segoe UI",Roboto,Arial,sans-serif;fill:#5f6b7a;text-anchor:middle}
  .note{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--mut);line-height:1.5}
  .spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .loading{color:var(--mut);font-size:14px;padding:12px 14px}
</style>
</head>

 S:{c:"var(--S)",n:["Stabil","Steadiness"],
    s:["Sabar, setia dan penyokong pasukan yang boleh diharap.","Patient, loyal and a dependable team supporter."],
    b:["Cenderung mengelak konflik dan lambat menerima perubahan.","Tends to avoid conflict and be slow to embrace change."],
    g:["Suarakan pandangan lebih awal, walaupun ia berbeza.","Speak up earlier, even when your view differs."]},
 C:{c:"var(--C)",n:["Teliti","Conscientiousness"],
    s:["Tepat, analitikal dan menjaga kualiti serta pematuhan.","Accurate, analytical and protective of quality and compliance."],
    b:["Boleh menjadi terlalu kritikal dan lambat memutuskan jika data tidak lengkap.","Can be overly critical and slow to decide when data is incomplete."],
    g:["Tetapkan tahap 'cukup baik' dan had masa untuk setiap keputusan.","Define 'good enough' and set a time limit for each decision."]}
};
var KEYS=["D","I","S","C"];
var S={list:[],i:null,needCode:false,code:"",email:"",role:"",step:-1,ans:[],order:[],busy:false};
ITEMS.forEach(function(){S.ans.push({m:"",l:""});S.order.push(shuffle(KEYS.slice()));});

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function $(s){return document.querySelector(s);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function bi(p){return esc(p[0])+'<span class="en">'+esc(p[1])+'</span>';}
/* Pelayan: dalam Apps Script guna google.script.run; di GitHub Pages guna fetch ke URL web app (API). */
function run(fn,arg){
  if(window.google&&google.script&&google.script.run){
    return new Promise(function(res,rej){var r=google.script.run.withSuccessHandler(res).withFailureHandler(rej);arg===undefined?r[fn]():r[fn](arg);});
  }
  if(!API)return Promise.reject(new Error("Pautan pelayan (API) belum ditetapkan. Sila maklumkan urus setia."));
  var body=Object.assign({action:fn},arg||{});
  var req=fn==="getParticipants"
    ? fetch(API+"?action=list",{method:"GET"})
    : fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
  return req.then(function(r){return r.json();}).then(function(j){if(!j.ok)throw new Error(j.error||"Ralat pelayan");return j.data;},
    function(e){throw new Error((e&&e.message&&e.message.indexOf("Failed to fetch")===-1)?e.message:"Tiada sambungan ke pelayan. Semak internet dan cuba lagi.");});
}
function foot(){return '<div class="foot">JANM WA13 Leadership Programme 2026 · 4–5 November 2026 · UUM<br>© 2026 Dr. Khairol Anuar Bin Ishak, Universiti Utara Malaysia. Hak cipta terpelihara. Soalan dan kandungan ujian ini tidak boleh disalin atau diedarkan tanpa kebenaran bertulis.</div>';}
function me(){return S.list.filter(function(x){return x.i===S.i;})[0];}

/* ---------- Skrin 1b: sahkan maklumat ---------- */
function viewConfirm(){
  var p=me();
  $("#app").innerHTML=
   '<div class="card"><h2>Sahkan maklumat anda<span class="en">Please verify your details</span></h2>'+
   '<p class="hint">Pastikan maklumat di bawah betul sebelum mula. Keputusan akan direkodkan di bawah nama ini.<span class="en">Make sure these are correct. Your result will be recorded under this name.</span></p>'+
   '<dl class="ver"><dt>Nama · Name</dt><dd>'+esc(p?p.name:"")+'</dd>'+
   '<dt>E-mel · Email</dt><dd>'+esc(S.email)+'</dd>'+
   '<dt>Jawatan · Position</dt><dd>'+(S.role?esc(S.role):'<span class="muted">—</span>')+'</dd>'+
   (S.needCode?'<dt>Kod program · Code</dt><dd>'+esc(S.code.toUpperCase())+'</dd>':'')+'</dl>'+
   '</div>'+
   '<div class="nav"><button class="btn ghost" id="fix">← Betulkan · Edit</button><button class="btn navy" id="start">Betul, mula ujian →</button></div>'+foot();
  $("#fix").addEventListener("click",function(){viewStart();window.scrollTo({top:0});});
  $("#start").addEventListener("click",function(){S.step=0;viewItem();window.scrollTo({top:0});});
}

/* ---------- Skrin 1: nama ---------- */
function viewStart(){
  $("#app").innerHTML=
   '<div class="card"><h2>Sebelum mula<span class="en">Before you start</span></h2>'+
   '<ul class="how">'+
   '<li>24 soalan, kira-kira 8–10 minit.<span class="en">24 questions, about 8–10 minutes.</span></li>'+
   '<li>Bagi setiap soalan, pilih <b>satu</b> pernyataan yang <b style="color:var(--ok)">PALING</b> menggambarkan diri anda dan <b>satu</b> yang <b style="color:var(--bad)">PALING KURANG</b> menggambarkan diri anda.<span class="en">For each question, pick ONE statement that is MOST like you and ONE that is LEAST like you.</span></li>'+
   '<li>Jawab berdasarkan diri anda <b>di tempat kerja</b>, bukan diri yang anda harapkan. Tiada jawapan betul atau salah.<span class="en">Answer as you really are at work, not as you wish to be. There are no right or wrong answers.</span></li>'+
   '</ul></div>'+
   '<div class="card"><h2>Pilih nama anda<span class="en">Select your name</span></h2>'+
   '<input type="text" id="q" placeholder="Taip nama untuk cari… / Type to search" autocomplete="off">'+
   '<div class="names" id="names"><div class="loading">Memuatkan senarai nama…</div></div>'+
   '<div class="chosen" id="chosen"></div>'+
   '</div>'+
   '<div class="card"><h2>Maklumat anda<span class="en">Your details</span></h2>'+
   '<span class="lbl">E-mel <span class="en" style="display:inline">· Email (keputusan boleh dihantar ke sini)</span></span>'+
   '<input type="email" id="email" autocomplete="email" inputmode="email" placeholder="nama@anm.gov.my" value="'+esc(S.email)+'">'+
   '<span class="lbl">Jawatan <span class="en" style="display:inline">· Position (pilihan)</span></span>'+
   '<input type="text" id="role" autocomplete="organization-title" placeholder="cth: Akauntan WA13, Ketua Unit" value="'+esc(S.role)+'">'+
   (S.needCode?'<span class="lbl">Kod program <span class="en" style="display:inline">· Programme code</span></span><input type="text" id="code" autocomplete="off" value="'+esc(S.code)+'">':'')+
   '<div class="err" id="err0" role="alert"></div>'+
   '</div>'+
   '<button class="btn navy full" id="go" disabled>Seterusnya · Next →</button>'+foot();
  $("#q").addEventListener("input",renderNames);
  $("#names").addEventListener("click",function(e){var b=e.target.closest("[data-i]");if(!b)return;S.i=Number(b.dataset.i);renderNames();});
  if($("#code"))$("#code").addEventListener("input",function(){S.code=this.value;});
  $("#email").addEventListener("input",function(){S.email=this.value.trim();});
  $("#role").addEventListener("input",function(){S.role=this.value.trim();});
  $("#go").addEventListener("click",function(){
    var x=$("#err0");
    /* baca terus dari kotak (termasuk autofill pelayar yang tidak mencetuskan 'input') */
    S.email=$("#email").value.trim(); S.role=$("#role").value.trim(); if($("#code"))S.code=$("#code").value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.email)){x.style.display="block";x.textContent="Sila masukkan e-mel yang sah. / Please enter a valid email.";$("#email").focus();return;}
    if(S.needCode&&!S.code.trim()){x.style.display="block";x.textContent="Sila masukkan kod program. / Please enter the programme code.";$("#code").focus();return;}
    if(!S.needCode){viewConfirm();window.scrollTo({top:0});return;}
    /* semak kod program di pelayan SEBELUM ujian bermula */
    var g=$("#go");g.disabled=true;g.textContent="Menyemak kod… · Checking…";
    var done=function(){g.disabled=false;g.textContent="Seterusnya · Next →";};
    fetch(API+"?action=check&code="+encodeURIComponent(S.code.trim()),{method:"GET"})
      .then(function(r){return r.json();})
      .then(function(j){done();
        if(!j.ok){x.style.display="block";x.textContent=(j.error||"Kod program tidak betul.")+" / Incorrect programme code.";$("#code").focus();return;}
        x.style.display="none";viewConfirm();window.scrollTo({top:0});
      },function(){done();x.style.display="block";x.textContent="Tiada sambungan ke pelayan. Semak internet dan cuba lagi. / No connection, please try again.";});
  });
  renderNames();
}
function renderNames(){
  var box=$("#names");if(!box)return;
  if(!S.list.length){box.innerHTML='<div class="loading">'+(S.loaded?"Senarai peserta belum diisi. Sila maklumkan urus setia.":"Memuatkan senarai nama…")+'</div>';return;}
  var q=$("#q").value.trim().toLowerCase();
  var l=S.list.filter(function(p){return !q||p.name.toLowerCase().indexOf(q)!==-1;});
  box.innerHTML=l.length?l.map(function(p){
    return '<button type="button" class="nm" data-i="'+p.i+'" aria-pressed="'+(S.i===p.i)+'"><span><span class="no">'+String(p.no).padStart(2,"0")+'</span>'+esc(p.name)+'</span>'+(p.sent?'<span class="sent">✓ Sudah jawab</span>':'')+'</button>';
  }).join(""):'<div class="loading">Tiada nama sepadan.</div>';
  var p=me();
  $("#chosen").textContent=p?("✓ "+p.name+(p.sent?" · menjawab semula akan menggantikan keputusan lama":"")):"";
  $("#go").disabled=!p;
}

/* ---------- Skrin 2: soalan ---------- */
function viewItem(){
  var k=S.step,it=ITEMS[k],a=S.ans[k],n=ITEMS.length;
  $("#app").innerHTML=
   '<div class="card">'+
   '<div class="prog"><span>Soalan '+(k+1)+' / '+n+'</span><span class="done-n">'+S.ans.filter(function(x){return x.m&&x.l;}).length+' dijawab</span></div>'+
   '<div class="dots">'+S.ans.map(function(x,j){return '<button type="button" data-go="'+j+'" class="dot'+(x.m&&x.l?' ok':'')+(j===k?' cur':'')+'" aria-label="Soalan '+(j+1)+'">'+(j+1)+'</button>';}).join("")+'</div>'+
   '<div class="stem">'+bi(it.q)+'</div>'+
   '<div class="opts">'+S.order[k].map(function(s){
      var cls=a.m===s?" m":a.l===s?" l":"";
      return '<div class="op'+cls+'"><div class="t">'+bi(it.o[s])+'</div>'+
       '<div class="pick"><button type="button" class="pm" data-s="'+s+'" data-t="m" aria-pressed="'+(a.m===s)+'">✓ Paling · Most</button>'+
       '<button type="button" class="pl" data-s="'+s+'" data-t="l" aria-pressed="'+(a.l===s)+'">✗ Paling kurang · Least</button></div></div>';
   }).join("")+'</div>'+
   (a.m&&a.l?'<div class="saved">✓ Jawapan soalan '+(k+1)+' direkodkan. Tekan <b>Seterusnya</b>.<span class="en">Answer recorded. Tap Next.</span></div>'
     :'<div class="legend">Pilih satu <b style="color:var(--ok)">Paling</b> dan satu <b style="color:var(--bad)">Paling kurang</b>.'+(a.m||a.l?' <b>Tinggal satu lagi.</b>':'')+'</div>')+
   '<div class="nav"><button class="btn ghost" id="back">← Kembali</button>'+
   '<button class="btn navy" id="next"'+(a.m&&a.l?'':' disabled')+'>'+(k===n-1?'Semak & hantar':'Seterusnya →')+'</button></div>'+
   '</div>'+foot();
  $(".opts").addEventListener("click",function(e){
    var b=e.target.closest("[data-s]");if(!b)return;
    var s=b.dataset.s,t=b.dataset.t,o=t==="m"?"l":"m",y=window.scrollY;
    a[t]=a[t]===s?"":s; if(a[o]===s)a[o]="";
    viewItem(); window.scrollTo(0,y);
  });
  $(".dots").addEventListener("click",function(e){var b=e.target.closest("[data-go]");if(!b)return;S.step=Number(b.dataset.go);viewItem();window.scrollTo({top:0});});
  $("#back").addEventListener("click",function(){if(k===0){S.step=-1;viewStart();}else{S.step--;viewItem();}window.scrollTo({top:0});});
  $("#next").addEventListener("click",function(){if(k===n-1)viewSubmit();else{S.step++;viewItem();}window.scrollTo({top:0});});
}

/* ---------- Skrin 3: semak & hantar ---------- */
function viewSubmit(){
  var p=me(),miss=S.ans.map(function(a,k){return a.m&&a.l?null:k+1;}).filter(Boolean);
  $("#app").innerHTML=
   '<div class="card"><h2>Hampir siap, '+esc(p?p.name:"")+'<span class="en">Almost done</span></h2>'+
   (miss.length?'<p class="hint" style="color:var(--bad)">Soalan belum lengkap: '+miss.join(", ")+'</p>':'<p class="hint">Semua soalan telah dijawab.<span class="en">All questions answered.</span></p>')+
   '<span class="lbl">Catatan (pilihan)<span class="en">Comment (optional)</span></span>'+
   '<textarea id="note" rows="2" maxlength="1000" placeholder="Apa yang anda harap dapat daripada program ini?"></textarea>'+
   '</div><div class="err" id="err" role="alert"></div>'+
   '<div class="nav"><button class="btn ghost" id="back">← Kembali</button><button class="btn navy" id="send"'+(miss.length?' disabled':'')+'>Hantar · Submit</button></div>'+foot();
  $("#back").addEventListener("click",function(){S.step=miss.length?miss[0]-1:ITEMS.length-1;viewItem();});
  $("#send").addEventListener("click",function(){
    if(S.busy)return;S.busy=true;var b=this;b.disabled=true;b.innerHTML='<span class="spin"></span> Menghantar…';
    run("submitDisc",{i:S.i,code:S.code,email:S.email,role:S.role,ans:S.ans,note:$("#note").value}).then(function(r){S.busy=false;viewResult(r);},function(e){
      S.busy=false;b.disabled=false;b.textContent="Hantar · Submit";
      var x=$("#err");x.style.display="block";x.textContent=(e&&e.message)||"Gagal menghantar. Semak sambungan internet dan cuba lagi.";
    });
  });
}

/* ---------- Skrin 4: keputusan ---------- */
function circle(r){
  /* Bulatan DISC: D kiri-atas, i kanan-atas, S kanan-bawah, C kiri-bawah. Titik = kedudukan anda. */
  var c=150,R=120,a=r.angle*Math.PI/180,d=Math.max(0.06,r.dist),px=c+d*R*Math.cos(a),py=c-d*R*Math.sin(a);
  /* setiap kuadran: dari pusat ke titik pertama, lengkok melawan arah jam ke titik kedua */
  function q(x1,y1,x2,y2,col){return '<path d="M'+c+' '+c+' L'+x1+' '+y1+' A'+R+' '+R+' 0 0 0 '+x2+' '+y2+' Z" fill="'+col+'" opacity=".16"/>';}
  return '<svg viewBox="-34 0 368 300" class="circ" role="img" aria-label="Kedudukan anda pada bulatan DISC: '+r.blend+'">'+
   q(c+R,c,c,c-R,"#e2a400")+q(c,c-R,c-R,c,"#d64545")+q(c-R,c,c,c+R,"#2f6fd6")+q(c,c+R,c+R,c,"#2e9d5b")+
   '<circle cx="'+c+'" cy="'+c+'" r="'+R+'" fill="none" stroke="#c9d2de"/>'+
   '<circle cx="'+c+'" cy="'+c+'" r="'+(R/2)+'" fill="none" stroke="#e3e8ef" stroke-dasharray="3 3"/>'+
   '<line x1="'+(c-R)+'" y1="'+c+'" x2="'+(c+R)+'" y2="'+c+'" stroke="#c9d2de"/><line x1="'+c+'" y1="'+(c-R)+'" x2="'+c+'" y2="'+(c+R)+'" stroke="#c9d2de"/>'+
   '<text x="96" y="106" class="ql" fill="#d64545">D</text><text x="204" y="106" class="ql" fill="#c08c00">i</text>'+
   '<text x="204" y="214" class="ql" fill="#2e9d5b">S</text><text x="96" y="214" class="ql" fill="#2f6fd6">C</text>'+
   '<text x="150" y="20" class="ax">Aktif · Tegas</text><text x="150" y="292" class="ax">Tenang · Sederhana</text>'+
   '<text x="-30" y="154" class="ax" style="text-anchor:start">Logik</text><text x="330" y="154" class="ax" style="text-anchor:end">Mesra</text>'+
   '<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="11" fill="#0f2a4a" stroke="#fff" stroke-width="3"/>'+
   '</svg>';
}
function viewResult(r){
  var p=me(),st=STYLE[r.disc1],blend=[r.disc1].concat(r.disc2?[r.disc2]:[]);
  var bd=BLEND[r.blend]||BLEND[r.disc1==="I"?"i":r.disc1];
  var strength=r.balanced?["Seimbang: anda mudah menyesuaikan gaya mengikut situasi.","Balanced: you adapt your style to the situation."]
    :r.dist>=0.6?["Kecenderungan kuat: gaya ini sangat jelas dalam tingkah laku anda.","Strong tendency: this style shows clearly in your behaviour."]
    :r.dist>=0.3?["Kecenderungan sederhana: gaya ini jelas, dengan unsur gaya lain.","Moderate tendency: clear, with elements of other styles."]
    :["Kecenderungan ringan: anda dekat dengan pusat dan fleksibel.","Mild tendency: close to the centre and flexible."];
  var bars=KEYS.slice().sort(function(a,b){return r.pct[b]-r.pct[a];}).map(function(s){
    return '<div class="br" style="--c:'+STYLE[s].c+'"><span><b>'+s+'</b> · '+STYLE[s].n[0]+'</span><div class="tr"><i style="width:'+r.pct[s]+'%"></i></div><span class="v">'+r.pct[s]+'</span></div>';
  }).join("");
  var sec=r.disc2?'<p><span class="k">Gaya kedua: '+r.disc2+' ('+STYLE[r.disc2].n[0]+').</span> '+esc(STYLE[r.disc2].s[0])+'<span class="en">Secondary style: '+STYLE[r.disc2].n[1]+'. '+esc(STYLE[r.disc2].s[1])+'</span></p>':'';
  $("#app").innerHTML=
   '<div class="card"><div class="res-head"><div class="ic">✓</div><h2>Terima kasih, '+esc(p?p.name:"")+'!<span class="en">Your result has been recorded.</span></h2>'+
   '<div class="blend">'+blend.map(function(s){return '<span style="--c:'+STYLE[s].c+'">'+(s==="I"?"i":s)+'</span>';}).join("")+'</div>'+
   '<div style="font-weight:700;color:var(--navy);margin-top:4px">Gaya kerja anda: '+esc(r.blend)+'</div>'+
   '<p class="hint" style="margin:6px 0 0">'+bi(bd)+'</p></div></div>'+
   '<div class="card actions"><div class="act">'+
     '<button class="btn navy" id="bPrint">🖨️ Cetak / Simpan PDF</button>'+
     '<button class="btn ghost" id="bMail">✉️ Hantar ke e-mel</button>'+
     '<button class="btn ghost" id="bReset">↺ Mula semula</button></div>'+
     '<div class="hint" id="mailMsg" style="margin:10px 0 0;text-align:center">Laporan akan dihantar ke <b>'+esc(S.email)+'</b>.</div></div>'+
   '<div class="card"><h2>Kedudukan anda pada bulatan DISC<span class="en">Your position on the DISC circle</span></h2>'+circle(r)+
   '<p class="hint" style="margin:8px 0 0"><b>'+esc(strength[0])+'</b><span class="en">'+esc(strength[1])+'</span></p>'+
   '<p class="hint" style="margin:6px 0 0">Titik yang jauh dari pusat menunjukkan kecenderungan yang lebih kuat ke arah gaya itu.<span class="en">The further the dot is from the centre, the stronger the pull toward that style.</span></p></div>'+
   '<div class="card"><h2>Profil skor<span class="en">Score profile (0–100; garis tengah = 50)</span></h2><div class="bars">'+bars+'</div></div>'+
   '<div class="card desc"><h2>'+r.disc1+' · '+st.n[0]+'<span class="en">'+st.n[1]+'</span></h2>'+
   '<h3>Kekuatan · Strengths</h3><p>'+bi(st.s)+'</p>'+
   '<h3>Titik buta · Blind spot</h3><p>'+bi(st.b)+'</p>'+
   '<h3>Fokus pembangunan · Development focus</h3><p>'+bi(st.g)+'</p>'+sec+
   '<p class="hint" style="margin-top:10px">Kita akan bincangkan keputusan ini dalam sesi Modul 1A. Tiada gaya yang lebih baik daripada gaya lain; setiap gaya membawa kekuatan berbeza kepada pasukan.<span class="en">We will discuss this in Module 1A. No style is better than another; each brings different strengths to a team.</span></p>'+
   '<p class="note">Ujian ini ialah alat refleksi bengkel berdasarkan model DISC dua dimensi Marston. Ia bukan instrumen psikometrik yang disahkan, dan tidak digunakan untuk keputusan perjawatan.<span class="en">This is a workshop reflection tool based on Marston\'s two-dimensional DISC model. It is not a validated psychometric instrument and is not used for HR decisions.</span></p></div>'+
   '<div class="print-only">Dicetak: '+new Date().toLocaleString("ms-MY")+' · '+esc(p?p.name:"")+' · '+esc(S.email)+(S.role?' · '+esc(S.role):'')+'</div>'+foot();
  $("#bPrint").addEventListener("click",function(){window.print();});
  $("#bReset").addEventListener("click",function(){
    S.i=null;S.email="";S.role="";S.code="";S.step=-1;S.ans=[];S.order=[];
    ITEMS.forEach(function(){S.ans.push({m:"",l:""});S.order.push(shuffle(KEYS.slice()));});
    var pp=S.list.filter(function(x){return x.i===p.i;})[0];if(pp)pp.sent=true;
    viewStart();window.scrollTo({top:0});
  });
  $("#bMail").addEventListener("click",function(){
    var b=this,m=$("#mailMsg");if(b.disabled)return;b.disabled=true;b.textContent="Menghantar…";
    run("emailResult",{i:p.i,code:S.code}).then(function(){
      b.textContent="✓ Dihantar";m.innerHTML="Laporan telah dihantar ke <b>"+esc(S.email)+"</b>. Semak juga folder spam.";
    },function(e){b.disabled=false;b.textContent="✉️ Hantar ke e-mel";m.textContent=(e&&e.message)||"Gagal menghantar e-mel.";});
  });
  window.scrollTo({top:0,behavior:"smooth"});
}

viewStart();
run("getParticipants").then(function(d){S.list=d.list;S.needCode=d.needCode;S.loaded=true;if(S.step===-1)viewStart();},
  function(e){S.loaded=true;var b=$("#names");if(b)b.innerHTML='<div class="loading">'+esc((e&&e.message)||"Gagal memuatkan senarai.")+'</div>';});
})();
</script>
